openapi: '3.0.0'
info:
  description: API for [Aeternity Middleware](https://github.com/aeternity/ae_mdw)
  title: Aeternity Middleware
  version: '0.0'

servers:
  - url: '/mdw/v3'
    description: 'V3 version path'

components:
  parameters:
    LimitParam:
      in: query
      name: limit
      description: 'Limit paginated resources (max 100)'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StatsLimitParam:
      in: query
      name: limit
      description: 'Limit paginated resources (max 1000)'
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    ScopeParam:
      in: query
      name: scope
      description: 'Scopes results in a generation range'
      schema:
        type: string
        pattern: '(gen):\d+(-\d+)?'
    HyperchainScopeParam:
      in: query
      name: scope
      description: 'Scopes results in a hyperchain epoch range'
      schema:
        type: string
        pattern: '(epoch):\d+(-\d+)?'
    DirectionParam:
      in: query
      name: direction
      description: 'Sorts results in forwards or backwards direction'
      schema:
        type: string
        enum:
          - forward
          - backward
    MinerIdParam:
      in: path
      name: minerId
      description: 'The account of the miner key or of the beneficiary'
      required: true
      schema:
        $ref: '#/components/schemas/AccountAddress'
    MinerRoleParam:
      in: query
      name: role
      description: >-
        If the miners are identified by the miner key or by the beneficiary that gets the
        rewards, both are accounts. When listing miners it is the miner key by default, and
        for a single miner it is found from the account: the miner key unless it only has
        stats as a beneficiary.
      schema:
        type: string
        enum:
          - miner
          - beneficiary
    MiningBucketParam:
      in: path
      name: bucket
      description: 'The bucket number, which is the generation divided by the bucket size (20)'
      required: true
      schema:
        type: integer
        minimum: 0
    MiningIntervalByParam:
      in: query
      name: interval_by
      description: 'The calendar interval (UTC) of each row. Each row is a bucket of 20 generations (about an hour) when it is not given'
      schema:
        type: string
        enum:
          - day
          - week
          - month
    MiningMinStartDateParam:
      in: query
      name: min_start_date
      description: 'The minimum start date in YYYY-MM-DD format, only with `interval_by`'
      schema:
        type: string
        example: '2024-01-01'
    MiningMaxStartDateParam:
      in: query
      name: max_start_date
      description: 'The maximum start date in YYYY-MM-DD format, only with `interval_by`'
      schema:
        type: string
        example: '2025-01-01'
  schemas:
    KeyBlockHash:
      description: Key block hash
      type: string
      example: kh_2Zfo2ALfRkKQxEaUj3HhcUGyMrTqYpDMgr2u15fPanYD1d55kz
      pattern: ^kh_\w{38,50}$
    MicroBlockHash:
      description: Micro block hash
      type: string
      example: mh_2Zfo2ALfRkKQxEaUj3HhcUGyMrTqYpDMgr2u15fPanYD1d55kz
      pattern: ^mh_\w{38,50}$
    TransactionHash:
      description: Transaction hash
      type: string
      example: th_2Zfo2ALfRkKQxEaUj3HhcUGyMrTqYpDMgr2u15fPanYD1d55kz
      pattern: ^th_\w{38,50}$
    TransactionEncoded:
      description: Encoded transaction
      type: string
      example: tx_+E8hAaEB4TK48d23oE5jt/qWR5pUu8UlpTGn8bwM5JISGQMGf7ABoQOvDVCf43V7alNbsUvTarXaCf7rjtWX36YLS4+JTa4jn4YPHaUyOAAAxRZ6Sg==
      pattern: ^tx_\w+$
    AccountAddress:
      description: Account address
      type: string
      example: "ak_psy8tRXPzGxh6975H7K6XQcMFVsdrxJMt7YkzMY8oUTevutzw"
      pattern: ^ak_\w{38,50}$
    NameString:
      description: AENS name
      type: string
      example: trustwallet.chain
      pattern: ^\w+\.chain$
    NameHash:
      description: AENS name hash
      type: string
      example: nm_psy8tRXPzGxh6975H7K6XQcMFVsdrxJMt7YkzMY8oUTevutzw
      pattern: ^nm_\w{38,50}$
    ContractAddress:
      description: Contract address
      type: string
      example: ct_2t7TnocFw7oCYSS7g2yGutZMpGEJta6dq2DTX38SmuqmwtN6Ch
      pattern: ^ct_\w{38,50}$
    ContractBytearray:
      description: Contract bytearray
      type: string
      example: cb_AAAAAfy4hFE=
      pattern: ^cb_\w+$
    OracleAddress:
      description: Oracle address
      type: string
      example: ok_2t7TnocFw7oCYSS7g2yGutZMpGEJta6dq2DTX38SmuqmwtN6Ch
      pattern: ^ok_\w{38,50}$
    ChannelId:
      description: Channel ID
      type: string
      example: ch_22SfHdnhUQBAHpC5euxHG9qjRWGfHsj47sZqSmXk4cTfJp4aUd
      pattern: ^ch_\w{38,50}$
    Signature:
      description: Signature
      type: string
      example: sg_8hhU15cVMbukFj4FbdrFwwYnbzXYPnstu9PDnWZGbfQNpeHcB6tK1F3wvG1MPYySARgDRJYUh3YPJD3HctFwg6Y4rUGSR
      pattern: ^sg_\w+$
    ErrorResponse:
      description: Error response from the API
      type: object
      example:
        error: 'invalid id: th_2Twp3pJeVuwQ7cMSdPQRfpAUWwdMiwx6coVMpRaNSuzFRnDZF'
      properties:
        error:
          description: The message of the error raised
          type: string
      required:
        - error
      title: Error response
    NotFoundResponse:
      description: Resource not found on the API
      type: object
      example:
        error: 'not found: th_2Twp3pJeVuwQ7cMSdPQRfpAUWwdMiwx6coVMpRaNSuzFRnDZF'
      properties:
        error:
          description: The message of the error raised
          type: string
      required:
        - error
      title: Not found response
    PaginatedResponse:
      type: object
      properties:
        next:
          type: string
          example: '/blocks?cursor=123'
          nullable: true
        prev:
          type: string
          example: '/blocks?cursor=234'
          nullable: true
      required:
        - next
        - prev
    TransactionType:
      $ref: '#/components/schemas/Tx/allOf/0/properties/type'
