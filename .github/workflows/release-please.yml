on:
  push:
    branches:
      - master
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: bash .github/scripts/release_as.sh >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{secrets.BOT_GITHUB_TOKEN}}
          skip-github-pull-request: ${{ steps.version.outputs.release-as != '' }}
      # the action ignores release-as with a manifest config, the CLI doesn't
      - if: steps.version.outputs.release-as != ''
        run: >-
          npx --yes release-please@17 release-pr
          --token="$TOKEN"
          --repo-url="$GITHUB_REPOSITORY"
          --release-as="$RELEASE_AS"
        env:
          TOKEN: ${{secrets.BOT_GITHUB_TOKEN}}
          RELEASE_AS: ${{ steps.version.outputs.release-as }}
